# A release fixture for image selection. No host ports or production database are used.
name: ${COMPOSE_PROJECT_NAME}
x-build: &build
  context: ../..
  dockerfile: Dockerfile
  args: &args
    VERSION: &version 1.0.3
    SWIZZLE_DOCKER_TEST_RUN: ${SWIZZLE_DOCKER_TEST_RUN}
services:
  runner-base:
    network_mode: none
    build:
      <<: *build
      target: runner-base
      args:
        <<: *args
        SWIZZLE_RUNNER_APT_PACKAGES: ${SWIZZLE_RUNNER_APT_PACKAGES:-}
  worker:
    init: true
    network_mode: none
    build:
      <<: *build
      target: worker
    environment:
      SWIZZLE_RUNNER_BASE_IMAGE: ${COMPOSE_PROJECT_NAME}-runner-base
    depends_on:
      runner-base:
        condition: service_completed_successfully
  api:
    init: true
    network_mode: none
    image: node:26.12.1-alpine3.24
    labels:
      swizzle.test.run: ${SWIZZLE_DOCKER_TEST_RUN}
    environment:
      RELEASE_VERSION: *version
    command:
      - node
      - --input-type=module
      - -e
      - >-
        import {createServer} from 'node:http';
        createServer((req, res) => {
          res.setHeader('content-type', 'application/json');
          res.end(JSON.stringify({status: 'ok', version: process.env.RELEASE_VERSION}));
        }).listen(19820, '0.0.0.0');
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:19820/ready"]
      interval: 1s
      timeout: 2s
      retries: 5
  backup:
    network_mode: none
    profiles: [tools]
    build:
      <<: *build
      target: backup
