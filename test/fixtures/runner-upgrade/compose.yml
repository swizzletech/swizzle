# A release fixture for image selection. No host ports or production database are used.
name: ${COMPOSE_PROJECT_NAME}
x-build: &build
  context: ../..
  dockerfile: Dockerfile
  args: &args
    VERSION: 1.0.3
services:
  runner-base:
    network_mode: none
    build:
      <<: *build
      target: runner-base
      args:
        <<: *args
        SWIZZLE_RUNNER_APT_PACKAGES: ${SWIZZLE_RUNNER_APT_PACKAGES:-}
  worker:
    network_mode: none
    build:
      <<: *build
      target: worker
    environment:
      SWIZZLE_RUNNER_BASE_IMAGE: ${COMPOSE_PROJECT_NAME}-runner-base
    depends_on:
      runner-base:
        condition: service_completed_successfully
  api:
    network_mode: none
    build:
      <<: *build
      target: api
  backup:
    network_mode: none
    profiles: [tools]
    build:
      <<: *build
      target: backup
