name: agent-pipeline-triage
version: 2.0.0
description: Join independent checks and return the workspace pointer with a final decision
entrypoint: main.ts
trigger:
  type: chain
  sources:
    - agent-pipeline-reviewer
    - agent-pipeline-e2e-verifier
  on: all-succeeded
  payload: results
runtime:
  language: typescript
  execution_mode: host
  profile: host-default
  timeout: 30s
  permissions:
    network: false
    writable_dirs: []
  retry:
    max_attempts: 3
    backoff: exponential
  requirements:
    binaries: []
secrets: []
