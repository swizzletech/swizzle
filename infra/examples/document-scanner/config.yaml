name: document-scanner
version: 1.0.0
description: Read incoming document text, find its topics, amounts, dates and emails, and ask a person when no topic matches
entrypoint: main.py
trigger:
  type: webhook
  path: /hooks/document-scan
runtime:
  language: python
  execution_mode: host
  profile: host-default
  timeout: 30s
  permissions:
    network: true
    writable_dirs: []
  retry:
    max_attempts: 3
    backoff: exponential
  requirements:
    binaries: []
secrets: []
