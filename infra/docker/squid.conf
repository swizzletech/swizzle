# The runner network is internal; this proxy is its only TCP egress path.
# CONNECT is deliberately limited to web and encrypted mail ports used by
# declared automations. Private and reserved destinations stay blocked below.
acl SSL_ports port 80
acl SSL_ports port 443
acl SSL_ports port 465
acl SSL_ports port 587
acl SSL_ports port 993
acl SSL_ports port 995
acl Safe_ports port 80
acl Safe_ports port 443
acl Safe_ports port 465
acl Safe_ports port 587
acl Safe_ports port 993
acl Safe_ports port 995
acl CONNECT method CONNECT

acl forbidden_destination dst 0.0.0.0/8
acl forbidden_destination dst 10.0.0.0/8
acl forbidden_destination dst 100.64.0.0/10
acl forbidden_destination dst 127.0.0.0/8
acl forbidden_destination dst 169.254.0.0/16
acl forbidden_destination dst 172.16.0.0/12
acl forbidden_destination dst 192.0.0.0/24
acl forbidden_destination dst 192.0.2.0/24
acl forbidden_destination dst 192.168.0.0/16
acl forbidden_destination dst 198.18.0.0/15
acl forbidden_destination dst 198.51.100.0/24
acl forbidden_destination dst 203.0.113.0/24
acl forbidden_destination dst 224.0.0.0/4
acl forbidden_destination dst 240.0.0.0/4
acl forbidden_destination6 dst ::/128
acl forbidden_destination6 dst ::1/128
acl forbidden_destination6 dst fc00::/7
acl forbidden_destination6 dst fe80::/10
acl forbidden_destination6 dst 2001:db8::/32
acl forbidden_destination6 dst ff00::/8

# ADR 0013: only the authenticated inference gateway receives this private destination exception.
# Its control listener binds runner-control and is never allowed here.
acl local_llm dstdomain -n local-llm-inference
acl local_llm_port port 8080
http_access allow local_llm local_llm_port
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny forbidden_destination
http_access deny forbidden_destination6
http_access allow all

http_port 3128
cache deny all
cache_store_log none
access_log stdio:/dev/stdout
cache_log /dev/stderr
# Squid runs in the foreground under a non-root user. A PID file is unnecessary
# and would fail on Compose's root-owned tmpfs mounted at /var/run/squid.
pid_filename none
visible_hostname swizzle-runner-egress
via off
forwarded_for delete
request_header_access X-Forwarded-For deny all
request_header_access Via deny all
