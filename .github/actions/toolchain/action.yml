name: Toolchain
description: Install the toolchain mise.toml pins, just included, and the locked dependencies from the cached pnpm store. Run it after checkout.

runs:
  using: composite
  steps:
    - name: Install the toolchain from mise.toml
      uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

    - name: Restore the pnpm store
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        # pnpm's default store on a Linux runner, where neither PNPM_HOME nor XDG_DATA_HOME is set.
        path: ~/.local/share/pnpm/store
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-

    - name: Install the dependencies
      shell: bash
      run: just deps
