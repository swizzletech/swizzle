version: 2
updates:
  - package-ecosystem: npm
    directory: /
    commit-message:
      prefix: build
      include: scope
    schedule:
      interval: weekly
    groups:
      dependencies:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    commit-message:
      prefix: ci
      include: scope
    schedule:
      interval: weekly
