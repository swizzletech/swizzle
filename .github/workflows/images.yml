name: Release images

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'swizzletech/swizzle'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout public release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the toolchain
        uses: ./.github/actions/toolchain

      - name: Enable arm64 builds
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2

      - name: Sign in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Plan, publish, sign, and verify every image
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          just init-env
          just image-plan "${RELEASE_TAG#v}" images.json
          just image-publish "${RELEASE_TAG#v}" images.json
          just image-sign "${RELEASE_TAG#v}" images.json
