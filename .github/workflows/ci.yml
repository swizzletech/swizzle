name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# A newer push to a pull request cancels its older run. Every push to main keeps its own run,
# so each commit on main gets a verdict.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# CI runs the static, dispatch and browser gates beside full-suite test shards.
# `Verify` requires every shard directly, including after a partial rerun.
jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the toolchain
        uses: ./.github/actions/toolchain

      - name: Static gate
        run: just check

      - name: Generated reference is current
        run: just _reference-current

      - name: Compose files are valid
        run: just compose-check

      - name: Scan tracked files for secrets
        run: just secret-scan

      - name: Audit dependencies
        run: just audit

  # Full shards make CI catch failures outside a change's import graph.
  # Share the steps, but keep separate job IDs so Verify reads every shard's result.
  test-1:
    name: Test 1/3
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHARD: 1/3
    steps: &test-steps
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the toolchain
        uses: ./.github/actions/toolchain

      - name: Test all files in this shard
        run: just test --shard="$SHARD"

  test-2:
    name: Test 2/3
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHARD: 2/3
    steps: *test-steps

  test-3:
    name: Test 3/3
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHARD: 3/3
    steps: *test-steps

  dispatch:
    name: Dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the toolchain
        uses: ./.github/actions/toolchain

      - name: Verify dispatch
        run: just verify-dispatch

  # The one job that runs `just setup` whole, so a fresh clone's setup stays proven.
  e2e:
    name: Build and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the toolchain
        uses: ./.github/actions/toolchain

      # Keyed by the Playwright version, which alone decides the browser build it downloads.
      - name: Restore the e2e browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('node_modules/.pnpm/playwright-core@*/node_modules/playwright-core/package.json') }}

      - name: Set up
        run: just setup

      - name: Build and run the dashboard flows
        run: just e2e

  # Branch protection requires this job by its name, `Verify`, so adding, splitting or
  # resharding a job above needs no change to the protection rules: list it under `needs`.
  # `always()` runs it after a failed or cancelled job too, because a job that does not run
  # is skipped, and GitHub counts a skipped required check as passed.
  verify:
    name: Verify
    if: ${{ always() }}
    needs: [check, test-1, test-2, test-3, dispatch, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: | # conventions-allow ci-runs-just-recipes: CI's verdict over its own jobs, which no developer runs
          node <<'JS'
          const jobs = Object.entries(JSON.parse(process.env.RESULTS));
          for (const [name, job] of jobs) console.log(`${name}: ${job.result}`);
          process.exitCode = jobs.every(([, job]) => job.result === "success") ? 0 : 1;
          JS
